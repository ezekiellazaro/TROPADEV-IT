<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Thank you from your Barangay Kapitan" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .title { font: 900 68px 'Segoe UI', Arial, Helvetica, sans-serif; fill: #15343d; letter-spacing: 1px; }
    .sub { font: 800 20px 'Segoe UI', Arial, Helvetica, sans-serif; fill: #d63a3a; letter-spacing: 1px; }
    .fadeup { opacity: 0; animation: fadeup .9s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .5s; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .float { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .thumb { transform-box: fill-box; transform-origin: 50% 100%; animation: thumb 1.4s ease-in-out infinite; }
    @keyframes thumb { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
    .flag { transform-box: fill-box; transform-origin: 0% 50%; animation: flag 2s ease-in-out infinite; }
    @keyframes flag { 0%,100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-6deg) scaleX(.93); } }
    .heart { transform-box: fill-box; transform-origin: center; opacity: 0; animation: rise 3s ease-in infinite; }
    .h2 { animation-delay: 1s; } .h3 { animation-delay: 2s; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(20px) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-50px) scale(1.2); } }
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes cursor { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="798" height="238" rx="22" fill="#ffffff" stroke="#e3e8ef" stroke-width="2"/>
  <text class="title fadeup d1" x="48" y="120">THANK YOU<tspan class="cursor" fill="#d63a3a">!</tspan></text>
  <text class="sub fadeup d2" x="52" y="158">FOR VISITING BARANGAY FIXTRACKER</text>

  <!-- Barangay Kapitan (original illustration) -->
  <g transform="translate(586,26)">
    <g class="float">
      <!-- flag on pole -->
      <line x1="26" y1="14" x2="26" y2="190" stroke="#8a6a43" stroke-width="4" stroke-linecap="round"/>
      <g class="flag">
        <rect x="28" y="14" width="46" height="14" fill="#0038a8"/>
        <rect x="28" y="28" width="46" height="14" fill="#ce1126"/>
        <path d="M28 14 L28 42 L50 28 Z" fill="#ffffff"/>
        <circle cx="34" cy="28" r="3" fill="#fcd116"/>
      </g>
      <!-- left arm -->
      <rect x="52" y="126" width="16" height="48" rx="8" fill="#f6edd3" stroke="#c9b98a" stroke-width="2"/>
      <circle cx="60" cy="178" r="8" fill="#e8b58a"/>
      <!-- body: barong tagalog -->
      <rect x="62" y="116" width="86" height="76" rx="24" fill="#f6edd3" stroke="#c9b98a" stroke-width="2"/>
      <path d="M95 116 L105 136 L115 116 Z" fill="#ffffff" stroke="#c9b98a" stroke-width="2" stroke-linejoin="round"/>
      <line x1="105" y1="136" x2="105" y2="190" stroke="#c9b98a" stroke-width="2"/>
      <g fill="#c9b98a"><circle cx="100" cy="148" r="2"/><circle cx="100" cy="162" r="2"/><circle cx="100" cy="176" r="2"/></g>
      <rect x="74" y="140" width="34" height="14" rx="3" fill="#0038a8"/>
      <text x="91" y="150.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">KAPITAN</text>
      <!-- neck + head -->
      <rect x="95" y="104" width="20" height="16" fill="#d9a276"/>
      <circle cx="70" cy="80" r="7" fill="#e8b58a"/><circle cx="140" cy="80" r="7" fill="#e8b58a"/>
      <ellipse cx="105" cy="78" rx="35" ry="38" fill="#e8b58a"/>
      <!-- hair -->
      <path d="M69 76 Q66 38 105 38 Q144 38 141 76 Q134 56 105 56 Q76 56 69 76 Z" fill="#2b2b2b"/>
      <path d="M69 76 Q67 66 72 60 L74 76 Z M141 76 Q143 66 138 60 L136 76 Z" fill="#9aa0a6"/>
      <!-- brows, eyes -->
      <path d="M84 70 Q91 66 98 70 M112 70 Q119 66 126 70" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle class="blink" cx="91" cy="80" r="4" fill="#1d1d1d"/>
      <circle class="blink" cx="119" cy="80" r="4" fill="#1d1d1d"/>
      <circle cx="81" cy="92" r="5" fill="#ff8fa3" opacity=".55"/><circle cx="129" cy="92" r="5" fill="#ff8fa3" opacity=".55"/>
      <!-- mustache + smile -->
      <path d="M90 96 Q98 91 105 96 Q112 91 120 96 Q112 101 105 98 Q98 101 90 96 Z" fill="#2b2b2b"/>
      <path d="M95 104 Q105 113 115 104" stroke="#8a3b2a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- right arm thumbs up -->
      <line x1="140" y1="136" x2="160" y2="118" stroke="#c9b98a" stroke-width="20" stroke-linecap="round"/>
      <line x1="140" y1="136" x2="160" y2="118" stroke="#f6edd3" stroke-width="16" stroke-linecap="round"/>
      <g class="thumb">
        <circle cx="163" cy="110" r="10" fill="#e8b58a"/>
        <rect x="158" y="92" width="9" height="20" rx="4.5" fill="#e8b58a"/>
      </g>
    </g>
  </g>

  <path class="heart" d="M575 70 c-5 -8 -17 -2 -11 7 l11 10 l11 -10 c6 -9 -6 -15 -11 -7z" fill="#ff4d6d"/>
  <path class="heart h2" d="M785 50 c-4 -6 -13 -1 -8 5 l8 8 l8 -8 c5 -7 -4 -11 -8 -5z" fill="#ff8fa3"/>
  <path class="heart h3" d="M560 165 c-4 -6 -13 -1 -8 5 l8 8 l8 -8 c5 -7 -4 -11 -8 -5z" fill="#ff4d6d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
